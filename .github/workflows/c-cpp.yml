name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev
    - name: build
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
    - name: build
      run: cmake --build build
